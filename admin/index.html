<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager — TARUDEREO</title>
</head>
<body>
  <!-- Decap's git-gateway backend bundles its own GoTrue client internally
       and reads config.yml's identity_url/gateway_url (pointed at DecapBridge)
       to build it correctly on its own.

       Do NOT also load netlify-identity-widget.js here: if window.netlifyIdentity
       exists, Decap's getAuthClient() defers entirely to that global instead of
       building its own client from identity_url — silently ignoring the
       DecapBridge config and falling back to the widget's hardcoded default
       (https://<this-domain>/.netlify/identity), which 404s and throws
       "Unable to access identity settings." That's the one bug this comment
       is here to stop someone from reintroducing. -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
