# Auth/save backend: DecapBridge stands in for Netlify Identity + Git Gateway
# (Netlify deprecated Git Gateway for new sites; DecapBridge is a drop-in
# replacement using the same git-gateway protocol Decap already speaks —
# see https://decapbridge.com). Collaborators log in with email + password,
# no GitHub account needed; DecapBridge holds the GitHub token and commits
# on their behalf.
backend:
  name: git-gateway
  repo: breathgfx/new-tarudereo
  branch: main
  identity_url: https://auth.decapbridge.com/sites/2b83e6cf-13c1-45ef-bb64-6be0d3a76575
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
# GitHub Pages project sites serve at /<repo-name>/, not the bare domain —
# DecapBridge's default guess (just your username) would link to a 404.
site_url: https://breathgfx.github.io/new-tarudereo

# Decap writes back to this exact file on every save, in full — the field
# tree below mirrors content.json's structure exactly (auto-generated from
# it) so nothing gets dropped. If you add a new field to content.json by
# hand later, add the matching field here too, or the CMS editor won't see
# (or will silently drop, on save) that field the next time someone edits
# and saves this file from /admin.
media_folder: "img"
public_folder: "/img"

